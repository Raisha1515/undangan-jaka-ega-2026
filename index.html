<script>
document.addEventListener("DOMContentLoaded", function () {

    /* =====================================================
       1. BUKA UNDANGAN
    ===================================================== */

    const cover = document.querySelector(".cover");
    const opening = document.querySelector(".opening");
    const bukaButton = document.querySelector(".btn-buka");

    function bukaUndangan() {
        if (cover) {
            cover.classList.add("cover-open");
        }

        document.body.classList.remove("locked");

        setTimeout(function () {
            if (opening) {
                opening.scrollIntoView({
                    behavior: "smooth",
                    block: "start"
                });
            }
        }, 300);
    }

    if (bukaButton) {
        bukaButton.addEventListener("click", bukaUndangan);
    }


    /* =====================================================
       2. ANIMASI SECTION
       - IntersectionObserver untuk browser modern
       - Fallback scroll untuk HP/browser tertentu
    ===================================================== */

    const sections = document.querySelectorAll("section:not(.cover)");

    function showSection(section) {
        if (!section) return;

        section.classList.add("visible");
    }


    /* IntersectionObserver */

    let sectionObserver = null;

    if ("IntersectionObserver" in window) {

        sectionObserver = new IntersectionObserver(
            function (entries) {

                entries.forEach(function (entry) {

                    if (entry.isIntersecting) {
                        showSection(entry.target);

                        sectionObserver.unobserve(entry.target);
                    }

                });

            },
            {
                threshold: 0.08,
                rootMargin: "0px 0px -40px 0px"
            }
        );

        sections.forEach(function (section) {
            sectionObserver.observe(section);
        });
    }


    /* =====================================================
       3. FALLBACK SCROLL
       Kalau IntersectionObserver tidak bekerja,
       animasi tetap akan muncul.
    ===================================================== */

    function checkSectionsOnScroll() {

        const screenHeight = window.innerHeight;

        sections.forEach(function (section) {

            if (section.classList.contains("visible")) {
                return;
            }

            const rect = section.getBoundingClientRect();

            if (
                rect.top < screenHeight * 0.90 &&
                rect.bottom > 0
            ) {
                showSection(section);
            }

        });
    }


    /* =====================================================
       4. ANIMASI ASSALAMU'ALAIKUM
    ===================================================== */

    const openingSection = document.querySelector(".opening");

    const assalam = openingSection
        ? openingSection.querySelector(".small-title")
        : null;

    let assalamShown = false;

    function showAssalam() {

        if (!assalam || assalamShown) {
            return;
        }

        assalamShown = true;

        assalam.classList.add("assalam-show");
    }


    if (openingSection && assalam) {

        if ("IntersectionObserver" in window) {

            const assalamObserver = new IntersectionObserver(
                function (entries) {

                    entries.forEach(function (entry) {

                        if (entry.isIntersecting) {

                            setTimeout(function () {
                                showAssalam();
                            }, 200);

                            assalamObserver.unobserve(
                                entry.target
                            );
                        }

                    });

                },
                {
                    threshold: 0.05,
                    rootMargin: "0px 0px -20px 0px"
                }
            );

            assalamObserver.observe(openingSection);

        } else {

            /* Fallback */

            setTimeout(function () {
                showAssalam();
            }, 500);
        }
    }


    /* =====================================================
       5. FALLBACK ASSALAM SAAT SCROLL
    ===================================================== */

    function checkAssalam() {

        if (!openingSection || !assalam || assalamShown) {
            return;
        }

        const rect = openingSection.getBoundingClientRect();

        if (
            rect.top < window.innerHeight * 0.90 &&
            rect.bottom > 0
        ) {
            showAssalam();
        }
    }


    /* =====================================================
       6. FOTO MEMPELAI - ZOOM BERDASARKAN POSISI SCROLL
    ===================================================== */

    const couplePhotos = document.querySelectorAll(
        ".couple .person img"
    );

    function updateCouplePhotoScale() {

        if (!couplePhotos.length) {
            return;
        }

        const viewportCenter = window.innerHeight / 2;

        couplePhotos.forEach(function (photo) {

            const couple = photo.closest(".couple");

            if (
                couple &&
                !couple.classList.contains("visible")
            ) {
                return;
            }

            const rect = photo.getBoundingClientRect();

            const photoCenter =
                rect.top + rect.height / 2;

            const distance =
                Math.abs(
                    viewportCenter - photoCenter
                );

            const maxDistance =
                window.innerHeight * 0.75;

            let progress =
                1 - distance / maxDistance;

            progress =
                Math.max(
                    0,
                    Math.min(1, progress)
                );

            const scale =
                1 + progress * 0.08;

            photo.style.setProperty(
                "--photo-scale",
                scale.toFixed(3)
            );

            if (progress > 0.60) {

                photo.classList.add(
                    "scroll-focus"
                );

            } else {

                photo.classList.remove(
                    "scroll-focus"
                );
            }

        });
    }


    /* =====================================================
       7. FOTO GALLERY - ZOOM BERDASARKAN SCROLL
    ===================================================== */

    const galleryPhotos =
        document.querySelectorAll(
            ".gallery-container img"
        );

    function updateGalleryPhotoScale() {

        if (!galleryPhotos.length) {
            return;
        }

        const viewportCenter =
            window.innerHeight / 2;

        galleryPhotos.forEach(function (photo) {

            const rect =
                photo.getBoundingClientRect();

            const photoCenter =
                rect.top + rect.height / 2;

            const distance =
                Math.abs(
                    viewportCenter - photoCenter
                );

            const maxDistance =
                window.innerHeight * 0.90;

            let progress =
                1 - distance / maxDistance;

            progress =
                Math.max(
                    0,
                    Math.min(1, progress)
                );

            const scale =
                0.94 + progress * 0.12;

            photo.style.setProperty(
                "--gallery-scale",
                scale.toFixed(3)
            );

        });
    }


    /* =====================================================
       8. OPTIMASI SCROLL UNTUK HP
       Tidak menjalankan fungsi berkali-kali dalam 1 frame.
    ===================================================== */

    let ticking = false;

    function updateAnimations() {

        checkSectionsOnScroll();
        checkAssalam();

        updateCouplePhotoScale();
        updateGalleryPhotoScale();

        ticking = false;
    }

    function requestAnimationUpdate() {

        if (!ticking) {

            window.requestAnimationFrame(
                updateAnimations
            );

            ticking = true;
        }
    }


    /* =====================================================
       9. EVENT SCROLL
    ===================================================== */

    window.addEventListener(
        "scroll",
        requestAnimationUpdate,
        {
            passive: true
        }
    );


    /* =====================================================
       10. EVENT RESIZE / ROTATE HP
    ===================================================== */

    window.addEventListener(
        "resize",
        requestAnimationUpdate
    );


    window.addEventListener(
        "orientationchange",
        function () {

            setTimeout(
                requestAnimationUpdate,
                300
            );

        }
    );


    /* =====================================================
       11. JALANKAN SEKALI SAAT PERTAMA KALI LOAD
    ===================================================== */

    setTimeout(function () {

        checkSectionsOnScroll();
        checkAssalam();

        updateCouplePhotoScale();
        updateGalleryPhotoScale();

    }, 100);


    /* =====================================================
       12. JALANKAN LAGI SETELAH LOAD SEMUA GAMBAR
    ===================================================== */

    window.addEventListener(
        "load",
        function () {

            setTimeout(
                requestAnimationUpdate,
                100
            );

        }
    );

});
</script>
